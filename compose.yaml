services:
  postgres:
    image: postgres:17-alpine
    container_name: treasury-intelligence-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-treasury_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-treasury}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-treasury_local_dev}

    ports:
      - "${POSTGRES_PORT:-55432}:5432"

    volumes:
      - treasury_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-treasury} -d ${POSTGRES_DB:-treasury_intelligence}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  treasury_postgres_data:
